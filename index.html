<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>💕 520领取对象神器</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* ===== 弹窗样式 ===== */
        .swal2-popup.my-swal {
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #fff0f5, #ffe4ec);
            border: 2px solid #ffb6c1;
            animation: shake 0.6s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }

        .swal2-title {
            font-size: 1.4em !important;
            color: #c71585 !important;
            line-height: 1.6 !important;
        }

        .swal2-title small {
            font-size: 0.75em;
            color: #d66ba0;
            font-weight: normal;
        }

        .swal2-input {
            border: 2px solid #ffb6c1 !important;
            border-radius: 12px !important;
            text-align: center !important;
            font-size: 1.2em !important;
            padding: 10px 16px !important;
            color: #c71585 !important;
            width: 280px !important;
        }

        .swal2-input:focus {
            border-color: #ff69b4 !important;
            box-shadow: 0 0 0 3px rgba(255,105,180,0.2) !important;
        }

        .swal2-confirm.my-swal {
            background: linear-gradient(135deg, #ff69b4, #ff1493) !important;
            border-radius: 12px !important;
            font-size: 1.1em !important;
            padding: 12px 32px !important;
            box-shadow: 0 4px 15px rgba(255,20,147,0.4) !important;
            border: none !important;
        }

        .swal2-confirm.my-swal:hover {
            background: linear-gradient(135deg, #ff1493, #c71585) !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,20,147,0.5) !important;
        }

        .swal2-validation-message {
            background: #fff0f5 !important;
            color: #c71585 !important;
            border-radius: 8px !important;
            font-size: 0.9em !important;
        }

        .swal2-inputerror {
            border-color: #ff69b4 !important;
            animation: inputShake 0.4s ease-in-out;
        }

        @keyframes inputShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-3px); }
        }

        /* ===== 揭晓页面 ===== */
        .reveal-page {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            overflow: hidden;
        }

        .reveal-page.active {
            display: flex;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 粒子/星空背景 */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* 飘落的爱心 */
        .hearts-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            top: -40px;
            font-size: 24px;
            animation: fall var(--fall-duration) linear infinite;
            animation-delay: var(--fall-delay);
        }

        @keyframes fall {
            0% { transform: translateY(-40px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0.3; }
        }

        /* 中心内容 */
        .reveal-content {
            text-align: center;
            z-index: 10;
            color: white;
        }

        .reveal-content .big-heart {
            font-size: 80px;
            animation: heartbeat 1.2s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(255,20,147,0.8));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        .reveal-content h1 {
            font-size: 2.5em;
            margin: 20px 0 10px;
            background: linear-gradient(135deg, #ff69b4, #ff1493, #ffb6c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 10px rgba(255,105,180,0.5)); }
            to { filter: drop-shadow(0 0 25px rgba(255,105,180,0.8)); }
        }

        .reveal-content p {
            font-size: 1.2em;
            color: #ffb6c1;
            margin: 10px 0;
            opacity: 0;
            animation: slideUp 0.8s ease forwards;
        }

        .reveal-content p:nth-child(3) { animation-delay: 0.5s; }
        .reveal-content p:nth-child(4) { animation-delay: 1s; }
        .reveal-content p:nth-child(5) { animation-delay: 1.5s; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 倒计时/日期 */
        .reveal-date {
            margin-top: 30px;
            padding: 15px 30px;
            background: rgba(255,105,180,0.15);
            border: 1px solid rgba(255,105,180,0.3);
            border-radius: 20px;
            font-size: 1.1em;
            color: #ffb6c1;
            opacity: 0;
            animation: slideUp 0.8s ease 2s forwards;
            backdrop-filter: blur(10px);
        }

        /* 按钮 */
        .reveal-btn {
            margin-top: 30px;
            padding: 14px 40px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255,20,147,0.5);
            transition: all 0.3s;
            opacity: 0;
            animation: slideUp 0.8s ease 2.5s forwards;
        }

        .reveal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255,20,147,0.7);
        }

        /* 播放音乐按钮 */
        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,105,180,0.3);
            border: 2px solid #ff69b4;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .music-btn:hover { background: rgba(255,105,180,0.5); }

        .music-btn.playing { animation: spin 2s linear infinite; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 自定义SweetAlert2容器背景 */
        .swal2-container {
            backdrop-filter: blur(5px);
            background: rgba(0,0,0,0.4) !important;
        }
    </style>
</head>
<body>

<!-- SweetAlert2 弹窗 -->
<div id="swal-container"></div>

<!-- 揭晓页面 -->
<div class="reveal-page" id="revealPage">
    <div class="stars" id="stars"></div>
    <div class="hearts-container" id="heartsContainer"></div>
    <div class="reveal-content">
        <div class="big-heart">💕</div>
        <h1>我喜欢你</h1>
        <p>从遇见你的那一刻起</p>
        <p>我的世界就变成了粉色 🌸</p>
        <p>520，做我对象好不好？</p>
        <div class="reveal-date">📅 2026年5月20日</div>
        <button class="reveal-btn" onclick="alert('那就说定啦！❤️')">我愿意 💝</button>
    </div>
</div>

<!-- 音乐按钮 -->
<button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>

<!-- 音乐 (使用免费的浪漫BGM) -->
<audio id="bgm" loop>
    <source src="https://sf6-cdn-tos.douyinstatic.com/obj/ies-music/7180316711491619596.mp3" type="audio/mpeg">
</audio>

<script>
    const answer = '520';
    const title = '💕 亲爱的，输入520领取你的对象';
    const hint = '请输入：520';
    const btnText = '✨ 领取我的对象';
    const errorMsg = '密码不对哦～再想想看 🤔';
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('musicBtn');

    // 创建星空
    function createStars() {
        const container = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.animationDelay = Math.random() * 3 + 's';
            container.appendChild(star);
        }
    }

    // 创建飘落爱心
    function createHearts() {
        const container = document.getElementById('heartsContainer');
        const emojis = ['💕', '💗', '💖', '💘', '💝', '❤️', '🧡', '💛', '💜', '🤍'];
        for (let i = 0; i < 30; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (Math.random() * 20 + 16) + 'px';
            heart.style.setProperty('--fall-duration', (Math.random() * 5 + 5) + 's');
            heart.style.setProperty('--fall-delay', (Math.random() * 8) + 's');
            container.appendChild(heart);
        }
    }

    // 显示弹窗
    function showSwal() {
        Swal.fire({
            title: `<b>${title}</b><p><small>${hint}</small></p>`,
            input: 'text',
            inputPlaceholder: '输入520',
            confirmButtonText: btnText,
            confirmButtonColor: '#ff1493',
            customClass: {
                popup: 'my-swal',
                confirmButton: 'my-swal',
            },
            allowOutsideClick: false,
            allowEscapeKey: false,
            inputValidator: (value) => {
                if (!value) return '请输入520～';
                if (value !== answer) return errorMsg;
            },
            preConfirm: () => {
                return true;
            }
        }).then((result) => {
            if (result.isConfirmed) {
                // 隐藏弹窗
                Swal.close();

                // 显示揭晓页面
                const page = document.getElementById('revealPage');
                page.classList.add('active');
                musicBtn.style.display = 'flex';

                // 创建粒子效果
                createStars();
                createHearts();

                // 自动播放音乐
                bgm.play().catch(() => {
                    // 浏览器可能阻止自动播放，显示音乐按钮
                    musicBtn.style.display = 'flex';
                });
            }
        });

        // 修改输入框事件，输入错误时抖动
        const inputEl = document.querySelector('.swal2-input');
        if (inputEl) {
            inputEl.addEventListener('input', () => {
                if (inputEl.value && inputEl.value !== answer) {
                    inputEl.classList.add('swal2-inputerror');
                    setTimeout(() => inputEl.classList.remove('swal2-inputerror'), 400);
                }
            });
        }
    }

    // 音乐控制
    let isPlaying = false;
    function toggleMusic() {
        if (isPlaying) {
            bgm.pause();
            musicBtn.textContent = '🎵';
            musicBtn.classList.remove('playing');
        } else {
            bgm.play();
            musicBtn.textContent = '🎶';
            musicBtn.classList.add('playing');
        }
        isPlaying = !isPlaying;
    }

    // 页面加载后显示弹窗
    window.addEventListener('load', () => {
        setTimeout(showSwal, 500);
    });
</script>

</body>
</html>
